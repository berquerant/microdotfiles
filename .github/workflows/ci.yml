name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: "false"
      - name: Install
        run: echo y | make
        env:
          GIT_USER_NAME: example_user_name
          GIT_USER_EMAIL: example_user_email
      - name: Setup Emacs
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: "30.1"
      - name: Init emacs
        run: |
          source ~/.bashrc
          make emacs
      - name: Load init.el
        run: emacs --batch --debug-init --load ~/.emacs.d/init.el
