name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Install
        run: echo y | make
        env:
          GIT_USER_NAME: example_user_name
          GIT_USER_EMAIL: example_user_email
      - name: Setup Emacs
        uses: purcell/setup-emacs@509bfe03ba1ffddb67b3c6d9eaaeb96b45182cc7
        with:
          version: "30.1"
      - name: Init emacs
        run: |
          source ~/.bashrc
          make emacs
      - name: Load init.el
        run: emacs --batch --debug-init --load ~/.emacs.d/init.el
